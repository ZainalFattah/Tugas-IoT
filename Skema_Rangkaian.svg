<text x="725" y="640" font-family="Arial,sans-serif" font-size="16" fill="#19394b">J6.3 = GND. HIGH menyalakan LED.</text>
<text x="40" y="697" font-family="Arial,sans-serif" font-size="22" fill="#19394b">KONEKSI MODUL DENGAN KABEL</text>
<text x="40" y="730" font-family="Arial,sans-serif" font-size="17" fill="#19394b">NodeMCU dan sensor berada di luar PCB. Urutan pin modul harus mengikuti label modul aktual.</text>
<text x="40" y="760" font-family="Arial,sans-serif" font-size="17" fill="#19394b">Jangan hubungkan AO 5 V langsung ke A0. DO MQ-135 tidak dipakai. Suplai DHT tetap 3,3 V.</text>
<text x="40" y="805" font-family="Arial,sans-serif" font-size="16" fill="#19394b">Review KiCad dan uji breadboard sebelum fabrikasi. Skema SVG ini bukan berkas ERC KiCad.</text>
