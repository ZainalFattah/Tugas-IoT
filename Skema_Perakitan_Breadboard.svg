<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1160" fill="#172b3c" role="img" aria-labelledby="title desc">
  <title id="title">Skema perakitan UdaraKita Kelompok 7 tanpa PCB</title>
  <desc id="desc">NodeMCU ESP8266 terhubung ke MQ-135, DHT11, dua LED, pembagi tegangan A0, dan Blynk melalui Wi-Fi. Jalur warna menunjukkan 5 volt, 3,3 volt, ground, dan sinyal.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:44px;font-weight:800;letter-spacing:.5px}.sub{font-size:20px;fill:#526879}
      .head{font-size:27px;font-weight:800}.pin{font-size:19px;font-weight:700}.small{font-size:16px;fill:#526879}.note{font-size:18px}
      .card{fill:white;stroke:#d8e3e8;stroke-width:2}.board{fill:#173d43;stroke:#0f292d;stroke-width:3}
      .hole{fill:#dbe4e7;stroke:#a9bbc4}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .v5{stroke:#ef6b30}.v3{stroke:#dca322}.gnd{stroke:#2c4153}.data{stroke:#178f7a}.adc{stroke:#7953c8}.green{stroke:#24a66d}.red{stroke:#db5362}
      .terminal{stroke:#fff;stroke-width:3}.component{fill:#fff;stroke:#20374a;stroke-width:2}
    </style>
    <pattern id="holes" width="30" height="26" patternUnits="userSpaceOnUse"><circle cx="15" cy="13" r="3" fill="#bccbd0"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#173d43" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1700" height="1160" fill="#f4f8f9"/>
  <rect x="0" y="0" width="1700" height="13" fill="#149c8a"/>
  <text x="80" y="80" class="title">UDARAKITA <tspan fill="#149c8a">/</tspan> SKEMA PERAKITAN</text>
  <text x="82" y="117" class="sub">Kelompok 7 · NodeMCU ESP8266 + MQ-135 + DHT11 · breadboard, tanpa PCB</text>
  <rect x="1255" y="42" width="360" height="100" rx="22" fill="#e1f7ee" stroke="#96dbc1"/>
  <text x="1284" y="81" class="head" fill="#137952">Blynk.Cloud</text>
  <text x="1284" y="110" class="small">Dashboard via Wi-Fi 2,4 GHz</text>

  <!-- Devices -->
  <rect x="65" y="180" width="420" height="730" rx="26" class="board" filter="url(#shadow)"/>
  <rect x="106" y="218" width="338" height="155" rx="16" fill="#0f252d" stroke="#79958b" stroke-width="3"/>
  <rect x="126" y="238" width="298" height="115" rx="10" fill="#0c7d76"/>
  <path d="M166 273h150m-124 25h172m-138 25h125" stroke="#d2f1a4" stroke-width="7" opacity=".85"/>
  <text x="275" y="411" text-anchor="middle" class="head" fill="white">NodeMCU V3</text>
  <text x="275" y="439" text-anchor="middle" class="small" style="fill:#d2e6e0">ESP8266 · ESP-12E · CH340</text>
  <rect x="200" y="842" width="150" height="42" rx="8" fill="#c7d3d6"/>
  <rect x="227" y="883" width="96" height="23" rx="5" fill="#9bafb6"/>
  <text x="275" y="827" text-anchor="middle" class="small" style="fill:#e5f1ed">USB data / catu 5 V</text>
  <g fill="#fff" font-family="Arial" font-size="18" font-weight="bold">
    <text x="392" y="517">A0</text><text x="392" y="576">D2</text><text x="392" y="635">D5</text><text x="392" y="694">D6</text>
    <text x="379" y="753">3V3</text><text x="378" y="812">GND</text><text x="354" y="871">VU/5V*</text>
  </g>
  <g fill="#d9e8dc" stroke="#718c85" stroke-width="3">
    <circle cx="470" cy="510" r="10"/><circle cx="470" cy="569" r="10"/><circle cx="470" cy="628" r="10"/><circle cx="470" cy="687" r="10"/>
    <circle cx="470" cy="746" r="10"/><circle cx="470" cy="805" r="10"/><circle cx="470" cy="864" r="10"/>
  </g>

  <rect x="1100" y="196" width="520" height="220" rx="25" class="card" filter="url(#shadow)"/>
  <rect x="1150" y="233" width="140" height="140" rx="22" fill="#b9c7cc" stroke="#839da2" stroke-width="5"/>
  <circle cx="1220" cy="303" r="51" fill="#748e95" stroke="#556b73" stroke-width="4"/>
  <circle cx="1220" cy="303" r="26" fill="#dce2dd"/>
  <text x="1320" y="262" class="head">MQ-135</text>
  <text x="1320" y="291" class="small">sensor respons gas</text>
  <text x="1320" y="334" class="pin" fill="#ef6b30">VCC 5 V</text>
  <text x="1320" y="362" class="pin" fill="#2c4153">GND</text>
  <text x="1320" y="390" class="pin" fill="#7953c8">AO · analog</text>

  <rect x="1100" y="462" width="520" height="202" rx="25" class="card" filter="url(#shadow)"/>
  <rect x="1156" y="493" width="118" height="140" rx="13" fill="#56b9db" stroke="#318eae" stroke-width="4"/>
  <g fill="#287ea6"><rect x="1174" y="515" width="20" height="20" rx="3"/><rect x="1205" y="515" width="20" height="20" rx="3"/><rect x="1236" y="515" width="20" height="20" rx="3"/><rect x="1174" y="548" width="20" height="20" rx="3"/><rect x="1205" y="548" width="20" height="20" rx="3"/><rect x="1236" y="548" width="20" height="20" rx="3"/><rect x="1174" y="581" width="20" height="20" rx="3"/><rect x="1205" y="581" width="20" height="20" rx="3"/><rect x="1236" y="581" width="20" height="20" rx="3"/></g>
  <text x="1320" y="510" class="head">DHT11</text>
  <text x="1320" y="539" class="small">modul 3 pin, 3,3 V</text>
  <text x="1320" y="577" class="pin" fill="#dca322">VCC 3V3</text>
  <text x="1320" y="605" class="pin" fill="#178f7a">DATA</text>
  <text x="1320" y="633" class="pin" fill="#2c4153">GND</text>

  <rect x="1100" y="710" width="520" height="200" rx="25" class="card" filter="url(#shadow)"/>
  <text x="1143" y="755" class="head">Indikator</text>
  <circle cx="1225" cy="808" r="22" fill="#27b971" stroke="#168353" stroke-width="5"/>
  <circle cx="1225" cy="868" r="22" fill="#f15b62" stroke="#ad3948" stroke-width="5"/>
  <text x="1266" y="815" class="pin">LED hijau · D5</text>
  <text x="1266" y="875" class="pin">LED merah · D6</text>

  <!-- Breadboard zone -->
  <rect x="540" y="180" width="500" height="730" rx="26" class="card" filter="url(#shadow)"/>
  <text x="574" y="222" class="head">BREADBOARD</text>
  <text x="574" y="249" class="small">pasang komponen pasif dan sambungan pada baris berbeda</text>
  <rect x="570" y="273" width="438" height="610" rx="15" fill="#f7f9f7" stroke="#c6d6d2" stroke-width="2"/>
  <rect x="590" y="305" width="398" height="110" fill="url(#holes)" opacity=".75"/>
  <rect x="590" y="470" width="398" height="235" fill="url(#holes)" opacity=".75"/>
  <rect x="590" y="758" width="398" height="95" fill="url(#holes)" opacity=".75"/>
  <text x="605" y="306" class="pin" fill="#ef6b30">+5 V</text>
  <text x="605" y="366" class="pin" fill="#dca322">+3V3</text>
  <text x="605" y="839" class="pin" fill="#2c4153">GND</text>

  <!-- Power and ground; paths behind signal -->
  <path class="wire v5" d="M470 864 H550 V326 H982 H1078 V336 H1100"/>
  <path class="wire v3" d="M470 746 H526 V385 H982 H1060 V574 H1100"/>
  <path class="wire gnd" d="M470 805 H535 V826 H980 H1068 V364 H1100 M1068 630 H1100 M1068 882 H1100"/>
  <path class="wire gnd" d="M742 826 V674 M827 826 V674"/>
  <path class="wire gnd" d="M1068 826 H1128 V825 M1128 885 V882 H1100"/>

  <!-- Analog branch -->
  <path class="wire adc" d="M1100 392 H1052 V532 H916"/>
  <path class="wire adc" d="M844 532 H742 H505 V510 H470"/>
  <rect x="844" y="513" width="72" height="38" rx="11" class="component"/>
  <text x="880" y="539" text-anchor="middle" class="small">47k</text>
  <circle cx="742" cy="532" r="9" fill="#7953c8" class="terminal"/>
  <path class="wire adc" d="M742 532 V579 M827 532 H742 M827 532 V584"/>
  <rect x="720" y="579" width="44" height="73" rx="10" class="component"/>
  <text x="742" y="606" text-anchor="middle" class="small">10k</text>
  <text x="742" y="627" text-anchor="middle" class="small">1%</text>
  <path class="wire adc" d="M742 652 V674 M827 626 V674"/>
  <path d="M804 591 H850 M804 608 H850" stroke="#20374a" stroke-width="4"/>
  <text x="849" y="593" class="small">C1</text><text x="849" y="614" class="small">100 nF</text>
  <text x="633" y="483" class="pin" fill="#7953c8">TITIK ADC</text>
  <text x="625" y="565" class="small">AO → 47k → A0</text>

  <!-- DHT data and pull-up -->
  <path class="wire data" d="M470 569 H490 V437 H1005 V602 H1100"/>
  <circle cx="948" cy="437" r="8" fill="#178f7a" class="terminal"/>
  <path class="wire data" d="M948 437 V480"/>
  <rect x="926" y="480" width="44" height="67" rx="9" class="component"/>
  <text x="948" y="508" text-anchor="middle" class="small">10k</text>
  <text x="948" y="528" text-anchor="middle" class="small">R3</text>
  <path class="wire v3" d="M948 547 V565 H1020 V385"/>
  <text x="624" y="458" class="small">DATA DHT11</text>

  <!-- LED signal paths -->
  <path class="wire green" d="M470 628 H505 V718 H880"/>
  <rect x="880" y="699" width="72" height="38" rx="11" class="component"/>
  <text x="916" y="725" text-anchor="middle" class="small">1k</text>
  <path class="wire green" d="M952 718 H1050 V808 H1100"/>
  <path class="wire red" d="M470 687 H491 V750 H786"/>
  <rect x="786" y="731" width="72" height="38" rx="11" class="component"/>
  <text x="822" y="757" text-anchor="middle" class="small">1k</text>
  <path class="wire red" d="M858 750 H1032 V868 H1100"/>

  <!-- decoupling note -->
  <rect x="606" y="714" width="346" height="77" rx="15" fill="#ecf5f3" stroke="#c4dcd4"/>
  <text x="624" y="743" class="small">C2 100 µF: + ke 5 V, − ke GND</text>
  <text x="624" y="769" class="small">C3 100 nF: 3V3 ke GND</text>

  <!-- Bottom summary -->
  <rect x="65" y="945" width="1555" height="156" rx="23" fill="#173d43"/>
  <text x="98" y="987" font-size="23" font-weight="bold" fill="#fff">Sebelum menyalakan</text>
  <text x="98" y="1026" font-size="19" fill="#e5f3ee">1. Pastikan semua GND menyatu.  2. Ukur titik ADC sebelum disambung ke A0: harus di bawah 1 V.</text>
  <text x="98" y="1057" font-size="19" fill="#e5f3ee">3. DHT11 memakai 3,3 V; MQ-135 memakai 5 V.  4. Saat upload, lepaskan catu 5 V eksternal.</text>
  <text x="98" y="1085" font-size="16" fill="#b8d3cc">*Keluaran 5 V USB berbeda antar-klon NodeMCU; ukur pin VU/5V. R3 10 kΩ hanya bila DHT11 belum memiliki pull-up.</text>
  <text x="80" y="1138" class="small">Warna kabel: jingga 5 V · kuning 3,3 V · biru gelap GND · hijau toska DHT · ungu analog · hijau/merah LED. DO MQ-135 tidak dipakai.</text>
</svg>
